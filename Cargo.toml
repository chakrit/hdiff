[package]
name = "hdiff"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"

[dependencies]
crossterm = { version = "=0.29.0", features = ["use-dev-tty"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
similar = "=3.2.0"
tree-sitter = { version = "=0.27.0", default-features = false }
tree-sitter-go = { version = "0.25.0", path = "vendor/tree-sitter-go" }
unicode-segmentation = "=1.13.3"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.clippy]
derive_partial_eq_without_eq = "warn"
